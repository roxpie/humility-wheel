<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kink Wheel Spinner</title>
<!-- Load Telegram Web App Script -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
/* Deep, dark latex/vinyl look background */
background: radial-gradient(circle, #1a0826 0%, #0a0210 100%);
color: #f1e1ff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
overflow: hidden;
}

/* Ambient neon background glow */
.glow-overlay {
position: absolute;
width: 500px;
height: 500px;
background: rgba(147, 51, 234, 0.15);
filter: blur(100px);
z-index: 1;
pointer-events: none;
}

.wheel-container {
position: relative;
width: 340px;
height: 340px;
z-index: 2;
}

/* Kinky spiked pointer at the top */
.pointer {
position: absolute;
top: -20px;
left: 50%;
transform: translateX(-50%);
width: 0;
height: 0;
border-left: 18px solid transparent;
border-right: 18px solid transparent;
/* Neon purple spiked pointer */
border-top: 30px solid #c026d3;
z-index: 10;
filter: drop-shadow(0px 0px 8px #c026d3);
}

/* Leather/Choker border around the wheel */
canvas {
width: 100%;
height: 100%;
border-radius: 50%;
border: 8px solid #111111;
box-shadow: 0 0 25px rgba(192, 38, 211, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
}

/* Sleek Dom/Sub style action button */
.spin-btn {
margin-top: 40px;
padding: 14px 45px;
background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
color: #ffffff;
border: 2px solid #111111;
border-radius: 30px;
font-size: 16px;
font-weight: bold;
letter-spacing: 2px;
text-transform: uppercase;
cursor: pointer;
z-index: 2;
box-shadow: 0 0 15px rgba(217, 70, 239, 0.5);
transition: all 0.3s ease;
}

.spin-btn:active {
transform: scale(0.95);
box-shadow: 0 0 5px rgba(217, 70, 239, 0.8);
}
</style>
</head>
<body>

<div class="glow-overlay"></div>

<div class="wheel-container">
<div class="pointer"></div>
<canvas id="wheel" width="600" height="600"></canvas>
</div>

<button class="spin-btn" id="spin-trigger" onclick="spinWheel()">Obey & Spin</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

// Define your custom kink entries here
const options = ["Spank", "Blindfold", "Wax Play", "Safeword?", "Edge", "Bondage", "Tease", "Command"];
const numSegments = options.length;
const segmentAngle = (2 * Math.PI) / numSegments;
let isSpinning = false;

// Preload an aesthetic leopard print pattern overlay image
const leopardImg = new Image();
// A clean, transparent leopard print stencil pattern
leopardImg.src = 'https://unsplash.com';

function drawWheel() {
// Create a pattern background once image loads
let pattern = null;
if (leopardImg.complete && leopardImg.width > 0) {
pattern = ctx.createPattern(leopardImg, 'repeat');
}

for (let i = 0; i < numSegments; i++) {
ctx.beginPath();
ctx.moveTo(300, 300);
ctx.arc(300, 300, 300, i * segmentAngle, (i + 1) * segmentAngle);

// Alternate colors between deep purple, matte black, and leopard print segments
if (i % 3 === 0) {
ctx.fillStyle = "#2e0854"; // Deep Purple
} else if (i % 3 === 1) {
ctx.fillStyle = "#0f0f14"; // Matte Black
} else {
// Fallback to warm golden-black leopard tint if image hasn't loaded yet
ctx.fillStyle = pattern ? pattern : "#78350f";
}

ctx.fill();

// Dark subtle dividers between segments
ctx.strokeStyle = "#1a1a24";
ctx.lineWidth = 2;
ctx.stroke();

// Typography styling (Gothic/Modern clean hybrid look)
ctx.save();
ctx.translate(300, 300);
ctx.rotate(i * segmentAngle + segmentAngle / 2);
ctx.textAlign = "right";

// High contrast text colors depending on background segment
ctx.fillStyle = (i % 3 === 1) ? "#d946ef" : "#ffffff";
ctx.font = "bold 26px sans-serif";
ctx.fillText(options[i], 260, 10);
ctx.restore();
}
}

// Handle drawing logic if pattern image takes time to load asynchronously
leopardImg.onload = function() {
drawWheel();
};

function spinWheel() {
if (isSpinning) return;
isSpinning = true;
document.getElementById('spin-trigger').style.opacity = '0.5';
document.getElementById('spin-trigger').disabled = true;

const randomDegrees = Math.floor(Math.random() * 360) + 2160; // 6 full aesthetic rotations
canvas.style.transform = `rotate(${randomDegrees}deg)`;

setTimeout(() => {
const actualDegrees = randomDegrees % 360;
// Calculate winning text relative to the 12 o'clock pointer
const winningIndex = Math.floor((360 - actualDegrees + 90) % 360 / (360 / numSegments));
const winner = options[winningIndex];

// Send back payload to the telegram channel
tg.sendData(JSON.stringify({ result: winner }));

// Slight delay before closing so they see the result glow
setTimeout(() => { tg.close(); }, 800);
}, 5000);
}

// Initial draw fallback
drawWheel();
</script>
</body>
</html>
