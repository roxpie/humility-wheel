<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freak Shack — Wheel of Humility</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--paper:#fff2f8;--pink:#ff3bab;--purple:#6e2a94;--lime:#6fe267;--deep:#24112f;--ink:#110815}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;padding:17px;overflow:hidden;color:var(--paper);text-align:center;font-family:"Courier New",monospace;background:radial-gradient(circle at 50% 25%,#9a3ab2 0,#49205f 34%,#24112f 75%)}
body:before{position:fixed;inset:0;z-index:-1;content:"";opacity:.13;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.3px);background-size:19px 19px;mask-image:linear-gradient(#000,transparent 86%)}
body:after{position:fixed;inset:0;z-index:-1;content:"";opacity:.05;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 9px,#fff 10px 11px);mix-blend-mode:screen}
.shell{width:min(430px,100%);min-height:min(620px,100dvh);margin:auto;display:flex;flex-direction:column;align-items:center}
.topline{width:100%;display:flex;justify-content:space-between;align-items:center;color:#e3acd4;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.topline strong{color:var(--lime);text-shadow:0 0 10px var(--lime)}
.round{padding:6px 8px;border:1px solid #6fe26799;color:var(--lime);transform:rotate(2deg)}
.title{margin:15px 0 4px}
.kicker{margin:0 0 5px;color:var(--pink);font-size:10px;font-weight:bold;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;color:var(--paper);font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(34px,9vw,43px);letter-spacing:.055em;line-height:.86;text-shadow:3px 3px 0 #7a1c8e,0 0 20px #ff3bab99}
.subtitle{margin:7px 0 0;color:#e9afd8;font-size:10px;letter-spacing:.045em}
.stage{position:relative;width:min(322px,78vw);aspect-ratio:1;margin:9px 0 31px}
.stage:before,.stage:after{position:absolute;border-radius:50%;content:"";pointer-events:none}
.stage:before{inset:-12px;border:2px solid var(--paper);box-shadow:0 0 0 5px #0d0612,0 0 25px #ff3babaa}
.stage:after{inset:-21px;border:1px solid #c8f23e99;transform:rotate(8deg)}
.pointer{position:absolute;top:-24px;left:50%;z-index:5;width:29px;height:37px;background:var(--lime);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 3px 0 #100612) drop-shadow(0 0 9px var(--lime));transform:translateX(-50%)}
.spikes{position:absolute;inset:0;z-index:4;pointer-events:none}
.spike{position:absolute;top:50%;left:50%;width:14px;height:25px;background:linear-gradient(90deg,#666a70,#f4f4f1 48%,#777b81);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(1px 2px 0 var(--ink));transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-184px)}
.wheel{position:absolute;inset:0;z-index:2;overflow:hidden;border:10px solid var(--ink);border-radius:50%;background:var(--deep);box-shadow:inset 0 0 0 2px #fff,inset 0 0 30px var(--deep),0 13px 0 var(--ink),0 21px 32px #11081599;transition:transform 4.8s cubic-bezier(.12,.78,.16,1);will-change:transform}
svg{display:block;width:100%;height:100%}
.label{fill:var(--paper);stroke:#23132d;stroke-width:2.25px;stroke-linejoin:round;paint-order:stroke fill;font:900 14px "Courier New",monospace;letter-spacing:-.09em;text-transform:uppercase;text-rendering:geometricPrecision}
.hub{position:absolute;top:50%;left:50%;z-index:7;display:grid;width:70px;height:70px;place-items:center;border:5px solid var(--ink);border-radius:50%;color:var(--deep);background:var(--lime);box-shadow:inset 0 0 0 2px #edffd0,0 4px 0 #5d2a88;font-size:10px;font-weight:900;line-height:1.05;text-transform:uppercase;transform:translate(-50%,-50%) rotate(-8deg)}
.dare{position:absolute;bottom:-24px;left:50%;z-index:8;width:130%;color:var(--pink);font-family:Impact,"Arial Black",sans-serif;font-size:clamp(30px,9vw,43px);letter-spacing:.015em;line-height:.85;text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),4px 4px 0 #8f3bb2;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:translateX(-50%) rotate(-2deg)}
.status{min-height:40px;margin:0 0 8px;color:#e9afd8;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.status strong{display:block;margin-top:4px;color:var(--lime);font-family:Impact,sans-serif;font-size:20px;letter-spacing:.07em;text-shadow:2px 2px 0 #18061f}
.spin-button{width:min(100%,292px);min-height:49px;border:2px solid #09050b;border-radius:4px;color:#18071c;background:var(--pink);box-shadow:0 5px 0 #99125c,0 0 23px #ff3bab66;cursor:pointer;font:900 13px "Courier New",monospace;letter-spacing:.15em;text-transform:uppercase;transition:transform .16s,background .16s,opacity .16s}
.spin-button:hover{background:#ff73c3}.spin-button:active{box-shadow:0 1px 0 #99125c;transform:translateY(4px)}.spin-button:disabled{cursor:wait;opacity:.55}
.footer{width:100%;margin-top:auto;padding-top:11px;border-top:1px solid #fff2f833;color:#aa78a8;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
@media(max-height:650px){body{padding-top:11px}.title{margin-top:10px}.stage{width:min(276px,67vw);margin-top:7px;margin-bottom:29px}.spike{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-158px)}.dare{bottom:-22px;font-size:34px}.status{min-height:35px}.spin-button{min-height:44px}}
</style>
</head>
<body>
<main class="shell" aria-label="Wheel of Humility">
  <header class="topline"><span><strong>FREAK SHACK</strong> / private club</span><span class="round" id="round">ROUND 01</span></header>
  <section class="title">
    <p class="kicker">A consenting adults ritual</p>
    <h1>WHEEL OF HUMILITY</h1>
    <p class="subtitle">Let the room decide. Keep your limits close.</p>
  </section>
  <section class="stage" aria-label="Interactive spin wheel">
    <div class="pointer" aria-hidden="true"></div>
    <div class="spikes" id="spikes" aria-hidden="true"></div>
    <div class="wheel" id="wheel">
      <svg viewBox="0 0 380 380" role="img" aria-labelledby="wheel-title">
        <title id="wheel-title">Possible dares</title>
        <defs>
          <linearGradient id="pinkSector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff58b8"/><stop offset=".48" stop-color="#c62f9d"/><stop offset="1" stop-color="#682578"/></linearGradient>
          <linearGradient id="purpleSector" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#391b58"/><stop offset=".5" stop-color="#752d98"/><stop offset="1" stop-color="#b84db2"/></linearGradient>
          <linearGradient id="greenSector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#387c68"/><stop offset=".5" stop-color="#72e36d"/><stop offset="1" stop-color="#2f5f62"/></linearGradient>
          <pattern id="stars" width="95" height="95" patternUnits="userSpaceOnUse">
            <rect width="95" height="95" fill="none"/>
            <g fill="#fff2f8" stroke="#24112f" stroke-width="1.5">
              <path d="M19 12l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
              <path d="M72 57l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
            </g>
            <g fill="#6fe267"><circle cx="51" cy="27" r="2.5"/><circle cx="31" cy="76" r="2"/></g>
            <path d="M84 13v15M76.5 20.5h15" stroke="#ffb5e1" stroke-width="2" stroke-linecap="round"/>
          </pattern>
          <radialGradient id="starField"><stop stop-color="#ff3bab" stop-opacity=".6"/><stop offset=".55" stop-color="#6e2a94" stop-opacity=".25"/><stop offset="1" stop-color="#110815" stop-opacity=".72"/></radialGradient>
        </defs>
        <g id="sectors"></g>
        <circle cx="190" cy="190" r="171" fill="url(#stars)" opacity=".72"/>
        <g id="labels"></g>
        <circle cx="190" cy="190" r="83" fill="url(#starField)"/>
        <g fill="#fff2f8" stroke="#24112f" stroke-width="1.5" opacity=".9">
          <path d="M190 101l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
          <path d="M112 183l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path d="M271 219l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
        </g>
        <circle cx="190" cy="190" r="171" fill="none" stroke="#f9d8ef" stroke-width="8" opacity=".95"/>
      </svg>
    </div>
    <div class="hub" aria-hidden="true">spin<br>the wheel</div>
    <div class="dare">DARE TO SPIN?</div>
  </section>
  <div class="status" id="result" role="status" aria-live="polite" aria-atomic="true">YOUR LIMITS. YOUR CALL.</div>
  <button class="spin-button" id="spin-button" type="button">OBEY &amp; SPIN</button>
  <footer class="footer">18+ only · clear signals · enthusiastic consent</footer>
</main>
<script>
(function(){
  const DEFAULT_OPTIONS=["Spank","Blindfold","Wax Play","Safeword?","Edge","Bondage","Tease","Command"];
  const supplied=(new URLSearchParams(location.search).get("options")||"").split("|").map(function(value){return value.trim().replace(/\s+/g," ")}).filter(Boolean);
  const options=[],seen=new Set();
  supplied.forEach(function(option){const key=option.toLowerCase();if(option.length<=40&&!seen.has(key)){seen.add(key);options.push(option)}});
  if(options.length<2) options.push.apply(options,DEFAULT_OPTIONS);
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();tg.expand()}
  const sectors=document.getElementById("sectors"),labels=document.getElementById("labels"),wheel=document.getElementById("wheel"),spikes=document.getElementById("spikes"),button=document.getElementById("spin-button"),result=document.getElementById("result"),round=document.getElementById("round");
  const center=190,radius=173,step=Math.PI*2/options.length;
  let rotation=0,spinning=false,roundNumber=1;
  function point(angle){return(center+radius*Math.cos(angle)).toFixed(2)+","+(center+radius*Math.sin(angle)).toFixed(2)}
  function escapeText(value){return value.replace(/[&<>"]/g,function(char){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]})}
  function render(){
    let spikeHtml="",sectorHtml="",labelHtml="";
    for(let i=0;i<16;i++) spikeHtml+='<span class="spike" style="--angle:'+(i*22.5)+'deg"></span>';
    const fills=["url(#pinkSector)","url(#purpleSector)","url(#greenSector)"],strokes=["#ff3bab","#6e2a94","#6fe267"];
    options.forEach(function(option,index){
      const start=-Math.PI/2+index*step,end=start+step,labelAngle=start+step/2,x=center+Math.cos(labelAngle)*123,y=center+Math.sin(labelAngle)*123;
      sectorHtml+='<path d="M 190 190 L '+point(start)+' A 173 173 0 0 1 '+point(end)+' Z" fill="'+fills[index%3]+'" stroke="'+strokes[index%3]+'" stroke-width="2.5"/>';
      labelHtml+='<text class="label" x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" text-anchor="middle" dominant-baseline="middle" transform="rotate('+((labelAngle*180/Math.PI)+90).toFixed(2)+" "+x.toFixed(2)+" "+y.toFixed(2)+')">'+escapeText(option)+"</text>";
    });
    spikes.innerHTML=spikeHtml;sectors.innerHTML=sectorHtml;labels.innerHTML=labelHtml;
  }
  function spin(){
    if(spinning)return;
    spinning=true;button.disabled=true;button.textContent="WHEEL IN MOTION";result.textContent="READING THE SIGNS...";
    roundNumber+=1;round.textContent="ROUND "+String(roundNumber).padStart(2,"0");
    const selected=Math.floor(Math.random()*options.length),slice=360/options.length,current=((rotation%360)+360)%360;
    rotation+=360*6+(360-(selected*slice+slice/2))-current;
    wheel.style.transform="rotate("+rotation+"deg)";
    setTimeout(function(){
      result.innerHTML="THE WHEEL CHOOSES<strong>"+escapeText(options[selected])+"</strong>";
      if(tg&&typeof tg.sendData==="function"){tg.sendData(JSON.stringify({result:options[selected]}));setTimeout(function(){tg.close()},800)}
      else{spinning=false;button.disabled=false;button.textContent="OBEY & SPIN"}
    },4800);
  }
  render();button.addEventListener("click",spin);
})();
</script>
</body>
</html>
